name: check-links

# Sem gatilho de push: a verificação é de rede, roda semanalmente e sob demanda.
# Link quebrado abre issue em vez de falhar o workflow — rede instável não pode
# virar alarme falso no histórico do repositório.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verificar links externos dos projetos
        id: check
        continue-on-error: true
        run: npm run check:links 2>&1 | tee link-report.txt

      - name: Abrir issue quando algum link estiver fora do ar
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const titulo = "check-links: link externo de projeto fora do ar";
            const relatorio = fs.existsSync("link-report.txt")
              ? fs.readFileSync("link-report.txt", "utf8").slice(-8000)
              : "(relatório não gerado)";
            const corpo = [
              "A verificação semanal de links (`npm run check:links`) encontrou pelo menos um link com problema.",
              "",
              "Saída do script:",
              "",
              "```",
              relatorio.trim(),
              "```",
              "",
              `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Se o link caiu de vez, remova-o de `lib/projects.ts` em vez de deixá-lo apontando para o vazio.",
            ].join("\n");

            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "check-links",
              per_page: 100,
            });
            const existente = abertas.data.find((issue) => issue.title === titulo);

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: corpo,
              });
              core.notice(`Comentário adicionado à issue #${existente.number}.`);
            } else {
              const nova = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ["check-links"],
              });
              core.notice(`Issue #${nova.data.number} aberta.`);
            }
